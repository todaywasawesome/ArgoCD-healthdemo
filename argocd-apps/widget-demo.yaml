apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: widget-demo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/todaywasawesome/ArgoCD-healthdemo.git
    targetRevision: demo-live
    path: apps/widget-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: widget-demo
  syncPolicy:
    syncOptions: [CreateNamespace=true]
